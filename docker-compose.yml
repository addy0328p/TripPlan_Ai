version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tripmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: tripmate_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate_user -d travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TripMate AI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripmate-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database URL (points to the db service)
      DATABASE_URL: postgresql://tripmate_user:${DB_PASSWORD:-changeme123}@db:5432/travel_db?sslmode=disable
      
      # API Keys (set these in your .env file)
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      
      # Default settings
      DEFAULT_ORIGIN_IATA: ${DEFAULT_ORIGIN_IATA:-DEL}
      
      # Python settings
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount static files for development
      - ./static:/app/static
      - ./templates:/app/templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: tripmate-network
